[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.13.1",
    "fastapi>=0.139.0",
    "greenlet>=3.0.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.0.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "redis>=8.0.1",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.49.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [
    "alembic",
    ".git",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
]
ignore = []


[tool.mypy]
strict = true
ignore_missing_imports = true
exclude = ["alembic/"]
plugins = [
    "pydantic.mypy"
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.8.0",
]
